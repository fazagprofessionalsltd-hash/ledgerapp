<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger Accounting</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#12304a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--ink:#12304a;--paper:#f1f4f2;--card:#fff;--rule:#cdd8d2;--ok:#0e6b58;--dr:#a2382b;--mute:#5b6b77}
@media(prefers-color-scheme:dark){:root{--ink:#dbe8f2;--paper:#0f1a22;--card:#16252f;--rule:#2c4150;--ok:#6fd1b4;--dr:#ef8b7d;--mute:#93a6b4}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
h2,h3{font-family:Georgia,serif;margin:.2em 0 .6em}
header{position:sticky;top:0;z-index:10;height:54px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:#12304a;color:#fff}
header img{height:38px;max-width:150px;object-fit:contain;margin-right:10px;border-radius:4px;background:#fff}.brand{display:flex;align-items:center;font-family:Georgia,serif;font-size:19px}
.layout{display:flex;min-height:calc(100vh - 54px)}
nav{position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px);overflow-y:auto;width:210px;flex:none;background:var(--card);border-right:2px solid var(--rule);padding:10px 0}
nav a{display:block;padding:11px 18px;cursor:pointer;border-left:4px solid transparent}
nav a:hover{background:var(--paper)}
nav a.on{border-color:var(--ok);font-weight:600;color:var(--ok);background:var(--paper)}
nav hr{border:0;border-top:1px solid var(--rule);margin:8px 0}nav a.mod{font-weight:700}nav a.sub{padding-left:30px}nav .grp{padding:10px 18px 4px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
main{flex:1;min-width:0;max-width:1100px;margin:0 auto;padding:16px}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0;align-items:end}.fb input,.fb select{margin-top:2px}
.ent{min-width:960px}.ent td{padding:4px}.ent input,.ent select{margin:0}.ent td:nth-child(5) input{min-width:170px}.ent td:nth-child(8) input{min-width:100px}
.stmt{min-width:1150px}.stmt td:first-child,.stmt th:first-child{position:sticky;left:0;background:var(--card);min-width:190px}.stmt .h td:first-child{background:var(--paper)}tr.h td{font-weight:700;background:var(--paper)}
.cs{width:auto;max-width:200px;margin:0 0 0 14px;padding:5px;background:#fff;color:#12304a}
.mb{display:none;padding:5px 11px;margin:0 10px 0 0;background:transparent;border:1px solid #fff}
@media(max-width:760px){.mb{display:inline-block}.brand{flex:1}
nav{position:fixed;height:auto;top:54px;bottom:0;left:0;z-index:5;transform:translateX(-100%);transition:transform .2s;overflow-y:auto}
nav.open{transform:none;box-shadow:4px 0 16px rgba(0,0,0,.3)}}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute)}
input,select,button{font:inherit;width:100%;padding:9px;margin-top:3px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink)}
button{background:var(--ok);color:#fff;border:0;cursor:pointer;width:auto;padding:9px 16px}
button.g{background:transparent;color:inherit;border:1px solid currentColor;padding:5px 10px;margin:0}
button.s{padding:4px 10px;margin:0;background:var(--ink);color:var(--paper)}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{background:var(--paper);font-weight:600}.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dr{color:var(--dr)}.cr{color:var(--ok)}.sm{font-size:12px;color:var(--mute)}
.bal b{display:block;font:600 22px Georgia,serif}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
tr.t td{font-weight:700;border-top:2px solid var(--ink)}.login{max-width:380px;margin:2vh auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:6px;display:none}
.hb{height:12px;background:var(--ok);border-radius:3px;min-width:2px}
</style></head><body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),CATS=['Revenue','Direct Costs','Expense','Assets','Equity','Liabilities'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString():'';
/* ---------- cloud sync (Supabase) ---------- */
/* Paste your own values from Supabase: Project Settings > API. Use the anon/public key ONLY. */
const SUPABASE_URL='https://jsrrqqnxzleqhdkmtjvz.supabase.co',SUPABASE_KEY='sb_publishable__S9vxgX40m5xx3pZhX6Yhw_k1m-QRyg';
let sb=null;try{if(window.supabase&&/^https:\/\//.test(SUPABASE_URL))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
const cloud={user:null,ready:false,msg:''};let ctimer=null;
const cloudPush=()=>{if(!sb||!cloud.user||!cloud.ready)return;clearTimeout(ctimer);ctimer=setTimeout(pushNow,1500)};
async function pushNow(){
 if(!sb||!cloud.user||!cloud.ready)return;
 const ts=new Date().toISOString();
 try{const{error}=await sb.from('ledger_state').upsert({user_id:cloud.user.id,data:root,updated_at:ts});if(error)throw error;
  localStorage.setItem('acc_cts',ts);localStorage.removeItem('acc_pend');cloud.msg='Synced '+when(ts)}
 catch(e){cloud.msg='Not synced yet ('+(e.message||'offline')+'). Will retry when online.'}}
async function pull(){
 if(!sb||!cloud.user)return;
 try{
  const{data,error}=await sb.from('ledger_state').select('data,updated_at').eq('user_id',cloud.user.id).maybeSingle();
  if(error)throw error;
  const pend=!!localStorage.getItem('acc_pend'),hasLocal=root.users.length>0;
  cloud.ready=true;
  if(!data){if(hasLocal)await pushNow();else cloud.msg='Connected. No cloud data yet.';return}
  const newer=data.updated_at>(localStorage.getItem('acc_cts')||'');
  let useCloud=newer&&!pend;
  if(newer&&pend)useCloud=confirm('The cloud has newer data, but this device has changes that were not synced.\n\nOK = use the cloud data (discard this device\'s unsynced changes)\nCancel = keep this device\'s data and overwrite the cloud');
  if(!hasLocal&&data.data&&data.data.users)useCloud=true;
  if(useCloud){root=data.data;ensure();if(!root.companies[root.active])root.active=Object.keys(root.companies)[0];
   persist();localStorage.setItem('acc_cts',data.updated_at);localStorage.removeItem('acc_pend');cloud.msg='Loaded from cloud '+when(data.updated_at)}
  else if(pend)await pushNow();
  else cloud.msg='Up to date '+when(data.updated_at);
 }catch(e){cloud.ready=false;cloud.msg='Offline - using data stored on this device'}}
function cloudLogin(){$('#app').innerHTML=`<div class="card login" style="margin-top:8vh"><h2>Cloud sign in</h2>
 <label>Email<input id="k_e" type="email" autocomplete="username"></label><label>Password<input id="k_p" type="password" autocomplete="current-password"></label>
 <p><button onclick="cloudIn()">Sign in</button> <button class="s" onclick="skipCloud()">Continue offline</button></p>
 <p class="sm">This is the cloud account that stores your data, not a Ledger user login.</p></div>`}
async function cloudIn(){const{data,error}=await sb.auth.signInWithPassword({email:$('#k_e').value.trim(),password:$('#k_p').value});
 if(error)return toast(error.message);cloud.user=data.user;await pull();render()}
function skipCloud(){sessionStorage.setItem('acc_offline','1');render()}
async function cloudOut(){if(!confirm('Sign out of cloud sync on this device?'))return;await sb.auth.signOut();sessionStorage.removeItem('acc_offline');location.reload()}
async function syncNow(){toast('Syncing...');await pull();await pushNow();render()}
function cloudCard(){
 if(!sb)return '<p class="sm">Cloud sync is not set up. Add your Supabase project URL and anon key near the top of index.html, then redeploy.</p>';
 if(!cloud.user)return '<p class="sm">Not signed in to the cloud. Data is stored on this device only.</p><p><button onclick="sessionStorage.removeItem(\'acc_offline\');location.reload()">Sign in to cloud</button></p>';
 return `<p class="sm">Signed in as <b>${esc(cloud.user.email)}</b>. ${esc(cloud.msg)}${localStorage.getItem('acc_pend')?' Changes waiting to sync.':''}</p><div class="bar"><button onclick="syncNow()">Sync now</button><button class="s" onclick="cloudOut()">Sign out</button></div>
 <p class="sm">Every change is saved on this device first and uploaded a moment later. If two devices edit at the same time, the last one to save wins.</p>`}
async function boot(){
 if(!sb)return render();
 try{const{data:{session}}=await sb.auth.getSession();
  if(!session)return sessionStorage.getItem('acc_offline')?render():cloudLogin();
  cloud.user=session.user;await pull()}catch(e){}
 render()}
addEventListener('online',()=>{if(cloud.user)syncNow()});

let root;try{root=JSON.parse(localStorage.getItem('acc'))}catch(e){}
const seed=name=>({co:{name,logo:''},payees:[],tx:[],classes:[['Cash','Assets'],['Bank','Assets'],['Sales','Revenue'],['Cost of Goods','Direct Costs'],['Rent','Expense'],['Equipment','Assets'],["Owner's Capital",'Equity'],['Loans','Liabilities']].map(([n,c])=>({n,c}))});
if(root&&!root.companies){const o=root;root={users:o.users,companies:{c1:{co:o.co,payees:o.payees,tx:o.tx,classes:o.classes,modes:o.modes}},active:'c1'}}
root=root||{users:[],companies:{c1:seed('')},active:'c1'};
Object.values(root.companies).forEach(c=>{if(c.modes){c.modes.forEach(m=>{if(!c.classes.some(x=>x.n==m))c.classes.push({n:m,c:'Assets'})});
 c.tx.forEach(t=>{if(t.mode){const d=t.type=='Debit';t.dr=d?t.cls:t.mode;t.cr=d?t.mode:t.cls;delete t.cls;delete t.mode;delete t.type}});delete c.modes}});
if(!root.companies[root.active])root.active=Object.keys(root.companies)[0];
const DEPTS=['Administration','Finance','Human Resources','Operations','Projects','Sales'];
const ensure=()=>Object.values(root.companies).forEach(c=>{
 const P=(p,n)=>p+String(n).padStart(3,'0');
 c.projects=c.projects||[];c.ptx=c.ptx||[];c.att=c.att||[];c.leave=c.leave||[];c.pay=c.pay||[];c.hrc=c.hrc||JSON.parse(JSON.stringify(HDEF));c.reqs=c.reqs||[];c.staff=c.staff||[];c.depts=c.depts||[...DEPTS];c.inv=c.inv||[];c.buds=c.buds||[];c.budSeq=Math.max(c.budSeq||0,c.buds.length);c.buds.forEach(b=>{if(!b.bs)b.bs='Pending'});c.reps=c.reps||[];c.clients=c.clients||[];c.invSeq=Math.max(c.invSeq||0,c.inv.length);c.repSeq=Math.max(c.repSeq||0,c.reps.length);
 c.prjSeq=Math.max(c.prjSeq||0,c.projects.length);c.empSeq=Math.max(c.empSeq||0,c.staff.length);c.reqSeq=Math.max(c.reqSeq||0,c.reqs.length);
 c.projects.forEach(p=>{if(!p.no)p.no=P('PRJ-',++c.prjSeq);['value','vat','wht','net'].forEach(k=>p[k]=p[k]||0);if(!p.bs){p.bs='Approved';p.bby='Migrated'}if(p.client===undefined)p.client=''});
 c.staff.forEach(s=>{if(!s.no)s.no=P('EMP-',++c.empSeq);s.mg=s.mg||0;s.ag=s.ag||0;s.inactive=s.inactive||''});
 c.ptx.forEach(t=>{if(t.doc===undefined)t.doc=t.ref||'';if(t.payee===undefined)t.payee=''})});ensure();
const persist=()=>localStorage.setItem('acc',JSON.stringify(root));const save=()=>{persist();localStorage.setItem('acc_pend','1');cloudPush()};persist();
const db=new Proxy({},{get:(_,k)=>k=='users'?root.users:root.companies[root.active][k],set:(_,k,v)=>{(k=='users'?root:root.companies[root.active])[k]=v;return true}});

let me=null;try{me=JSON.parse(sessionStorage.getItem('me'))}catch(e){}
let view='Dashboard',editId=null,draft=null;
const today=()=>new Date().toISOString().slice(0,10);
const hash=async s=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ledger:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
const catOf=n=>(db.classes.find(c=>c.n==n)||{}).c||'';
const classTotal=n=>db.tx.reduce((a,t)=>a+(t.dr==n?t.amt:0)-(t.cr==n?t.amt:0),0);
const inCat=(t,c)=>catOf(t.dr)==c||catOf(t.cr)==c;
const catTotal=c=>db.classes.filter(x=>x.c==c).reduce((a,x)=>a+classTotal(x.n),0);

/* ---------- auth ---------- */
function authScreen(){
 const first=!db.users.length;
 $('#app').innerHTML=`<div class="brand" style="justify-content:center;margin-top:6vh">${db.co.logo?`<img src="${db.co.logo}" alt="" style="height:48px;margin-right:12px">`:''}${esc(db.co.name||'Ledger')}</div><div class="card login" style="margin-top:2vh"><h2>${first?'Set up your organisation':'Sign in'}</h2>
 ${first?`<label>Organisation name<input id="a_co"></label><label>Your full name<input id="a_n"></label>`:''}
 <label>Username<input id="a_u" autocomplete="username"></label>
 <label>Password<input id="a_p" type="password" autocomplete="current-password"></label>
 <p><button onclick="${first?'setup()':'login()'}">${first?'Create admin account':'Sign in'}</button></p>
 ${first?'<p class="sm">The first account is the administrator. Add staff later from the Admin tab.</p>':''}</div>`;
}
async function setup(){const u=$('#a_u').value.trim(),p=$('#a_p').value,n=$('#a_n').value.trim();
 if(!u||p.length<4||!n)return toast('Enter name, username and a password of 4+ characters');
 db.co.name=$('#a_co').value.trim();db.users.push({u,n,h:await hash(p),role:'admin'});save();start(db.users[0])}
async function login(){const u=$('#a_u').value.trim(),h=await hash($('#a_p').value);
 const x=db.users.find(x=>x.u==u&&x.h==h);x?start(x):toast('Wrong username or password')}
function start(x){me={u:x.u,n:x.n,role:x.role};sessionStorage.setItem('me',JSON.stringify(me));view='Dashboard';render()}
function out(){sessionStorage.removeItem('me');me=null;render()}

/* ---------- shell ---------- */
const SECS={Directors:['Summary','Project budgets','Requests awaiting approval','Project reports','Approved requests'],'Human Resources':['Staff summary','Add staff','Staff register','Attendance','Leave','Payroll','HR analytics','Approval request'],'My HR':['Clock in/out','My leave','My payslips'],Projects:['Summary','Add project','Project budget','Transactions','Payment request','Project report'],Admin:['Organisation','User logins','Backup and restore','Cloud sync']};
const SEC={};Object.keys(SECS).forEach(m=>SEC[m]=SECS[m][0]);
const goSec=(m,s)=>{view=m;SEC[m]=s;render()};
const secOf=(m,h)=>{const o={};h.split('<!--S:').slice(1).forEach(x=>{const i=x.indexOf('-->'),k=x.slice(0,i);o[k]=(o[k]||'')+x.slice(i+3)});return o[SEC[m]]||''};
const go=v=>{view=v;render()};
const menu=()=>$('nav').classList.toggle('open');
function render(fresh){
 ensure();
 const cs={},snap={};if(!fresh)document.querySelectorAll('#app canvas').forEach(c=>{if(c._d)cs[c.id]=c.toDataURL()});if(!fresh)document.querySelectorAll('#app [id]').forEach(e=>{if(/^(p_|h_|iv_|rp_|bg_|qProjects|qHR|qFinance)/.test(e.id))snap[e.id]=e.value});
 const U=me&&root.users.find(u=>u.u==me.u);if(!U){me=null;sessionStorage.removeItem('me')}else me.role=U.role;
 if(!me)return authScreen();
 const r=me.role,ad=r=='admin';
 const mods=[...(ad||r=='director'?['Directors']:[]),...(ad||r=='hr'?['Human Resources']:[]),...(ad||r=='project'?['Projects']:[]),...(ad?['Admin']:[]),...(hMine()?['My HR']:[])];
 const FIN=ad||r=='finance'?['Dashboard','Financial Reports',...CATS,'Issue Invoice','Project Reports','Project Budget Forms','Request to Directors','Finance Approvals']:[];
 const vs=[...mods,...FIN];
 if(!vs.includes(view))view=vs[0]||'';
 const body=!vs.length?(()=>'<div class="card"><h2>No module assigned</h2><p>Your login has no module assigned yet. Please ask your administrator to assign a role.</p></div>'):({Dashboard:dash,'Financial Reports':fin,Admin:admin,Projects:projView,'Human Resources':hrView,'My HR':myView,Directors:dirView,'Request to Directors':finReq,'Issue Invoice':invView,'Project Reports':repView,'Project Budget Forms':bgView,'Finance Approvals':finView})[view]||(()=>catView(view));
 const sb=(t,on,c)=>`<a class="sub ${on?'on':''}" onclick="${c}">${t}</a>`;
 const navH=[...mods.map(m=>`<div class="grp">${m}</div>`+SECS[m].map(s=>sb(s,view==m&&SEC[m]==s,`goSec('${m}','${s}')`)).join('')),...(FIN.length?[`<div class="grp">Finance and Accounts</div>`+FIN.map(v=>sb(v,v==view,`go('${v}')`)).join('')]:[])].join('<hr>');
 $('#app').innerHTML=`<header><button class="mb" onclick="menu()" aria-label="Menu">&#9776;</button><div class="brand">${db.co.logo?`<img src="${db.co.logo}" alt="">`:''}${esc(db.co.name||'Ledger')}</div><div style="margin-left:auto">${esc(me.n)} <span class="sm" style="color:#c9d6df">(${esc(r)})</span> <button class="g" onclick="out()">Sign out</button></div></header>
 <div class="layout"><nav>${navH}</nav><main>${SECS[view]?secOf(view,body()):body()}</main></div>`;
 Object.entries(snap).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});
 initSig();Object.entries(cs).forEach(([k,u])=>{const c=document.getElementById(k);if(c){c._d=1;const im=new Image;im.onload=()=>c.getContext('2d').drawImage(im,0,0);im.src=u}});
 ['qProjects','qHR','qFinance'].forEach(rqTot);pCalc();hCalc();invCalc();bgTot()}

/* ---------- transaction form ---------- */
const FK=['date','payee','doc','desc','dr','cr','amt'],blank=()=>({date:today()});
const grab=()=>{if(draft)draft=draft.map((_,i)=>Object.fromEntries(FK.map(k=>[k,$('#f_'+k+'_'+i).value])))};
const sel=(f,i,items,v,lab)=>`<select id="f_${f}_${i}" onchange="pick('${f}',${i},this)"><option value="">${lab}</option>${items}<option value="__new">+ Add new…</option></select>`.replace(`value="${esc(v)}"`,`value="${esc(v)}" selected`);
function pick(f,i,el){
 if(el.value!='__new')return;
 grab();let n=prompt('Enter new name');n=n&&n.trim();draft[i][f]='';
 if(n){
  if(f=='dr'||f=='cr'){const k=parseInt(prompt('Category?\n'+CATS.map((c,j)=>(j+1)+' = '+c).join('\n')),10);
   if(!CATS[k-1])return render();if(!db.classes.some(c=>c.n==n))db.classes.push({n,c:CATS[k-1]})}
  else if(!db.payees.includes(n))db.payees.push(n)
  draft[i][f]=n;save()}
 render()}
const addRow=()=>{grab();draft.push(blank());render()};
function dash(){
 const t=editId?db.tx.find(x=>x.id==editId):null;
 if(!draft)draft=t?[{...t}]:Array.from({length:5},blank);
 const o=l=>l.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 const cl=CATS.map(c=>{const k=db.classes.filter(x=>x.c==c);return k.length?`<optgroup label="${c}">${k.map(x=>`<option value="${esc(x.n)}">${esc(x.n)}</option>`).join('')}</optgroup>`:''}).join('');
 const inp=(f,i,d,type='text',x='')=>`<input id="f_${f}_${i}" type="${type}" ${x} value="${esc(d[f])}">`;
 return `<div class="card"><h2>${editId?'Edit transaction':'Record transactions'}</h2>
 <div class="w"><table class="ent"><thead><tr><th>#</th><th>Date</th><th>Payer / Payee</th><th>Doc No.</th><th>Description</th><th>Debit class</th><th>Credit class</th><th>Amount</th></tr></thead><tbody>
 ${draft.map((d,i)=>`<tr><td>${i+1}</td><td>${inp('date',i,d,'date')}</td><td>${sel('payee',i,o(db.payees),d.payee,'Select')}</td><td>${inp('doc',i,d)}</td><td>${inp('desc',i,d)}</td>
 <td>${sel('dr',i,cl,d.dr,'Select')}</td><td>${sel('cr',i,cl,d.cr,'Select')}</td><td>${inp('amt',i,d,'number','min="0" step="0.01"')}</td></tr>`).join('')}</tbody></table></div>
 <div class="bar"><button onclick="post()">${editId?'Save changes':'Post all transactions'}</button>${editId?'<button class="g" onclick="editId=null;draft=null;render()">Cancel</button>':'<button class="g" onclick="addRow()">+ Add row</button>'}
 <span class="sm">Fill as many lines as you need; empty lines are skipped. Each amount is added to the debit class and reduced from the credit class.</span></div></div>
 <div class="card"><h3>Transactions</h3>${fbar(['date','payee','amt'])}<div id="txbox">${txbox()}</div></div>`;
}
function post(){
 grab();const now=new Date().toISOString(),recs=[];
 for(let i=0;i<draft.length;i++){const d=draft[i],amt=parseFloat(d.amt);
  if(!editId&&!d.payee&&!d.doc&&!d.desc&&!d.dr&&!d.cr&&!d.amt)continue;
  const p=draft.length>1?'Line '+(i+1)+': ':'';
  if(!d.date||!d.payee||!d.dr||!d.cr||!(amt>0))return toast(p+'fill date, payer/payee, both classes and an amount above 0');
  if(d.dr==d.cr)return toast(p+'debit and credit classes must be different');
  recs.push({date:d.date,payee:d.payee,doc:d.doc,desc:d.desc,dr:d.dr,cr:d.cr,amt})}
 if(!recs.length)return toast('Nothing to post. Fill in at least one line');
 if(editId)Object.assign(db.tx.find(x=>x.id==editId),recs[0],{eb:me.n,ea:now});
 else recs.forEach((r,i)=>db.tx.push({id:Date.now()+i,...r,by:me.n,at:now}));

function initSig(){document.querySelectorAll('#app canvas').forEach(c=>{const x=c.getContext('2d');x.lineWidth=2;x.lineCap='round';x.strokeStyle='#12304a';let dn=false;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{dn=true;c._d=1;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
 c.onpointermove=e=>{if(!dn)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
 c.onpointerup=c.onpointercancel=()=>{dn=false}})}
